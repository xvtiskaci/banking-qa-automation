[pytest]
testpaths = tests api_tests
python_files = test_*.py
addopts = -ra -p reports.pytest_reporting
pythonpath = .
markers =
    api: API-only tests without Selenium / browser
    unit: pure unit tests without browser
    procredit_mobile: ProCredit responsive mobile-web (live submission requires additional opt-in)
    site(name): browser site fixture (procreditbank or parabank)
    livebank: explicit opt-in live bank final submit, never in CI

# Stream INFO actions from LoggerUtils to PyCharm and Jenkins even for PASSED tests.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(message)s
log_cli_date_format = %H:%M:%S
